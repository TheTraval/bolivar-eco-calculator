<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bolívar Eco-Calculator</title>

    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
</head>

<body>

    <div class="container">

        <!-- LANGUAGE SELECTOR -->
        <div class="language-control">
            <label for="language">Language / Idioma:</label>

            <select id="language" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
        </div>


        <div class="header">
            <h1 id="title">Bolívar Eco-Calculator</h1>
        </div>


        <!-- CALCULATOR -->
        <div class="card calculator-card">

            <h2 id="transportTitle">Transportation</h2>

            <label for="transport" id="transportLabel">
                How do you travel to school?
            </label>

            <select id="transport">
                <option value="car" id="carOption">
                    Private Car
                </option>

                <option value="bus" id="busOption">
                    Bus
                </option>

                <option value="carpool" id="carpoolOption">
                    Carpool
                </option>

                <option value="walk" id="walkOption">
                    Walking / Bicycle
                </option>
            </select>


            <label for="paper" id="paperLabel">
                Sheets of paper used per day:
            </label>

            <input
                type="number"
                id="paper"
                min="0"
                value="0"
            >


            <label for="recycling" id="recyclingLabel">
                Level of recycling:
            </label>

            <select id="recycling">

                <option value="low" id="lowOption">
                    Low
                </option>

                <option value="medium" id="mediumOption">
                    Medium
                </option>

                <option value="high" id="highOption">
                    High
                </option>

            </select>


            <button onclick="calculateImpact()" id="calculateButton">
                Calculate
            </button>

        </div>


        <!-- RESULTS -->
        <div class="card result">

            <h2 id="resultsTitle">
                Results
            </h2>

            <p id="result">
                Your weekly CO₂ emissions will appear here.
            </p>

            <!-- ITEMIZED BREAKDOWN -->
            <div id="breakdown">

                <h3 id="breakdownTitle">
                    Itemized Breakdown
                </h3>

                <p id="transportResult"></p>

                <p id="paperResult"></p>

                <p id="recyclingResult"></p>

                <p id="totalResult"></p>

            </div>

            <!-- PRINT BUTTON -->
            <button onclick="printReport()" id="printButton">
                Print / Save as PDF
            </button>

        </div>

    </div>

</body>

</html>
